name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:


jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          lfs: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v5
        with:
          push: false

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: out/images/*.wup
